# .pre-commit-config.yaml

repos:
  - repo: local
    hooks:
      # Build student notebooks from *_Answers.ipynb
      #! REMOVE DAY1 below once I have encased each answer in
      #! <# answer> without the brackets above it and 
      #! <# end answer> below it.
      - id: build-student-notebooks
        name: Build student notebooks from *_Answers.ipynb
        entry: Scripts/process_notebooks.py
        language: python
        pass_filenames: true
        files: '.*Day1*_Answers\.ipynb$'
        stages: [commit]
        require_serial: true

      # Build learning_goals.pdf (conda) when learning_goals.md is staged
      - id: build-learning-goals-pdf
        name: Build learning_goals.pdf (conda)
        entry: |
          bash -c "conda run -n BMLB2025_2026 ./scripts/build_learning_goals.sh"
        language: system
        pass_filenames: false
        files: ^learning_goals\.md$
        stages: [pre-commit]

      # Fail if learning_goals.pdf changed but not added
      - id: fail-if-pdf-changed
        name: learning_goals.pdf must be added if changed
        entry: |
          bash -c "git diff --quiet -- learning_goals.pdf || (echo 'learning_goals.pdf updated. Run: git add learning_goals.pdf && re-commit.' >&2; exit 1)"
        language: system
        pass_filenames: false
        stages: [pre-commit]